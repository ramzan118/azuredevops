trigger:
  branches:
    include:
      - azureprod

variables:
  helmChart: 'node-api-chart'
  imageTag: '$(Build.BuildId)'

stages:
- stage: Deploy
  jobs:
  - job: Deploy
    pool:
      vmImage: 'ubuntu-latest'
# deploy-aks.yml (FIXED VERSION)
steps:
- task: HelmDeploy@0
  inputs:
    connectionType: 'Kubernetes Service Connection'
    kubernetesServiceEndpoint: 'node-api-cluster-connection'
    namespace: 'default'
    command: 'upgrade'
    # ADD INSTALL COMMAND FOR NEW DEPLOYMENTS
    arguments: '--install'
    chartType: 'FilePath'
    chartPath: '$(helmChart)'
    releaseName: 'node-api'
    # FIX VALUES OVERRIDE
    overrideValues: 'image.tag=$(imageTag)'
    # ADD VALUE FILE REFERENCE
    valueFile: '$(helmChart)/values.yaml'
