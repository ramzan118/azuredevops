trigger:
- azureprod

variables:
  ACR_NAME: myimagerepo
  AKS_NAME: $(env)-azure-test-cluster
  RESOURCE_GROUP: Test_resource_group
  APP_NAME: nodejs-app
  TAG: $(Build.BuildId)

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: Build and push Docker image
      inputs:
        containerRegistry: $(ACR_NAME)
        repository: $(APP_NAME)
        command: buildAndPush
        Dockerfile: '**/Dockerfile'
        tags: $(TAG)

- stage: Deploy
  displayName: Blue-Green Deployment
  dependsOn: Build
  jobs:
  - deployment: Deploy
    environment: 'production'
    strategy:
      canary:
        increments: [10, 50, 100]
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create image pull secret
            inputs:
              action: createSecret
              secretName: acr-auth
              namespace: default
              dockerRegistryEndpoint: $(ACR_NAME)

          - task: KubernetesManifest@0
            displayName: Deploy new version
            inputs:
              action: deploy
              namespace: default
              manifests: |
                manifests/deployment.yaml
                manifests/service.yaml
              imagePullSecrets: acr-auth
              containers: '$(ACR_NAME).azurecr.io/$(APP_NAME):$(TAG)'
              imageDigestFile: '$(System.DefaultWorkingDirectory)/digest.txt'

          - task: KubernetesManifest@0
            displayName: Patch environment variables
            inputs:
              action: patch
              kind: Pod
              name: '$(APP_NAME)-$(TAG)'
              namespace: default
              mergeStrategy: strategic
              patch: '{"spec":{"containers":[{"name":"$(APP_NAME)","env":[{"name":"MONGO_URI","value":"$(MONGO_URI)"}]}]}}'

          - task: AzureCLI@2
            displayName: Test new deployment
            inputs:
              azureSubscription: $(ACR_NAME)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Add your smoke tests here
                echo "Running smoke tests..."
                # Example: curl http://new-deployment-ip

          - task: KubernetesManifest@0
            displayName: Switch traffic to new version
            inputs:
              action: patch
              kind: Service
              name: $(APP_NAME)-service
              namespace: default
              mergeStrategy: strategic
              patch: '{"spec":{"selector":{"version":"$(TAG)"}}}'
